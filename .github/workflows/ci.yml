name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - uses: loonghao/vx@v0.8.36
      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-${{ runner.os }}
          shared-key: rust-${{ runner.os }}
      - name: Preflight
        run: vx just preflight

  build-artifacts:
    name: Build artifact (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: canvas-bridge-linux-x86_64
            binary: canvas-bridge
          - os: windows-latest
            artifact: canvas-bridge-windows-x86_64.exe
            binary: canvas-bridge.exe
          - os: macos-latest
            artifact: canvas-bridge-macos-x86_64
            binary: canvas-bridge
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: loonghao/vx@v0.8.36
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ runner.os }}
          shared-key: release-${{ runner.os }}
      - name: Build
        run: vx just build
      - name: Stage binary
        shell: bash
        run: cp target/release/${{ matrix.binary }} ${{ matrix.artifact }}
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
